<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 03 - Grade Calculator</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            text-align: center;
        }
        input {
            padding: 8px;
            font-size: 15px;
            margin: 5px;
        }
        button {
            padding: 8px 16px;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
        }
        #message {
            font-weight: bold;
            color: #d9534f;
            margin-top: 15px;
            min-height: 20px;
        }
        ul {
            list-style: none;
            padding: 0;
            max-width: 400px;
            margin: 20px auto;
            text-align: left;
        }
        li {
            padding: 8px 12px;
            background-color: #f2f2f2;
            margin-bottom: 6px;
            border-radius: 4px;
        }
        #summary {
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Grade Calculator</h1>
    <p>Enter student name and score (0 - 100):</p>

    <div>
        <input type="text" id="name" placeholder="Student name" />
        <input type="text" id="score" placeholder="Score (0-100)" />
    </div>

    <div>
        <button id="add">Add Student</button>
        <button id="clear">Clear All</button>
    </div>

    <p id="message"></p>

    <h3>Students List:</h3>
    <ul id="list"></ul>

    <p id="summary"></p>

    <script src="app.js"></script>
</body>
</html>
