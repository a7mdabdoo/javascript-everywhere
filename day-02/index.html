<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Day 02 - Score Checker</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            text-align: center;
        }
        input {
            padding: 8px;
            font-size: 16px;
        }
        button {
            padding: 8px 16px;
            cursor: pointer;
            margin: 5px;
        }
        #result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 15px;
        }
        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }
        li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <h1>Score Checker</h1>
    <p>Enter a score between 0 and 100:</p>

    <input type="text" id="score" placeholder="Enter score" />
    <button id="check">Check</button>
    <button id="clear">Clear</button>

    <p id="result"></p>

    <h3>History:</h3>
    <ul id="history"></ul>

    <script src="app.js"></script>
</body>
</html>
